name: Release dry run

# `cd.yml`'s publish path, on demand, with the Maven Central upload replaced by a publish to a
# directory under the runner's temp.
#
# `cd.yml` runs only on a `v*` tag, so the guards it carries would otherwise first execute during
# a real release -- and a release is the one build where "it has never run" is expensive: Central
# never re-uploads and never deletes, so a version that fails halfway is abandoned rather than
# fixed. This is where most of those steps get to fail cheaply. Not all of them: the exceptions are
# named below.
#
# What it proves: the version is a usable coordinate, every module's publication assembles, signs,
# and lands in a repository; a consumer resolves all nine artifacts from that repository on each
# target the consumer build names; every deployed file carries a detached signature; and every
# POM carries the name and description a module has to opt into.
#
# What it cannot prove:
#
#  - That Central accepts the result. Nothing is uploaded, so Central's own validation -- the
#    rest of the required POM fields, the staging bundle, whether the signing key's public half
#    is on a keyserver -- never runs. `publishToMavenCentral` additionally runs
#    `prepareMavenCentralPublishing` and the `...ToMavenCentralRepository` tasks, none of which
#    this exercises.
#  - That `cd.yml`'s "Check the release credentials are present" step works. It reads five
#    `secrets.*` and this workflow reads none, so that step has no counterpart here and still has
#    its first execution on a tag. The signing *mechanism* is rehearsed below in the same shape
#    `cd.yml` uses it -- protected key, key id, passphrase -- but the secrets themselves are not:
#    a `GPG_KEY_ID` stored in the 16-hex long form is refused there, after a green run here.
#  - That a *newly added* target publishes resolvably. The consumer step names its `compile*`
#    tasks by hand, so adding a target to a module without adding it to
#    `smoke-test/build.gradle.kts` and to both task lists leaves the new variant unresolved and
#    the job green -- the asymmetry `smoke-test/README.md` records: removing a published target
#    fails loudly, adding one is not covered until someone adds it there too.
#
# A green run here is "the build is ready to try", not "the release will succeed".
#
# Deliberately absent: `environment: release`, every `secrets.*` that `cd.yml` reads, and any tag,
# release, or remote publish step. The only credential is the automatic `github.token` below,
# scoped to `contents: read`. So this workflow cannot upload to Central and cannot write to the
# repository.
#
# It *can* sign, with a key generated inside the job -- passphrase-protected, and passed by key
# id, because that is the shape `cd.yml` signs in and a rehearsal of a simpler configuration
# rehearses the wrong thing. That is a smaller claim than it sounds: the key lives for one run and
# its public half is never distributed, so a signature made with it is one Central could not verify
# even if something did upload it -- and nothing here can. The property worth protecting was never
# "holds no key" but "holds no *secret* and publishes to no *remote*", and neither the key nor its
# literal passphrase is a secret: both are born and die inside one job. Do not swap either for a
# repository secret to make the signing "more realistic"; that trades the whole safety argument for
# nothing it does not already have.
#
# Why a key at all: `signAllPublications()` is unconditional, and measured on this tree a release
# version without a key does not skip signing quietly -- `publishToMavenLocal` fails with
# `No configured signatory`. The alternatives are making that call conditional, which puts a switch
# in the release path whose failure mode is publishing unsigned, or generating a key here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, with or without the leading v (e.g. 0.1.0 or v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

# Shares no group with `cd.yml`: a rehearsal must never queue behind, or ahead of, a real release.
concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    # macOS, for the reason `build.yml` and `cd.yml` both give: on Linux the Apple targets are
    # silently skipped rather than failed, so a rehearsal there would publish a catalogue with
    # three variants missing from the lower modules, two from the Compose ones, and report
    # success.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The same charset `cd.yml` applies to a tag, applied to free text from whoever dispatches
      # this -- so a version that would be refused there is refused here, rather than rehearsing a
      # release that cannot happen. The value reaches the shell as an environment variable rather
      # than as a `${{ }}` expression pasted into a command line: interpolated directly, a value
      # like `0.1.0"; some-command; "` would run.
      #
      # `${VERSION#v}` before anything else, so `0.1.0` and `v0.1.0` both work. Everything around a
      # release speaks in `v0.1.0`, which is what a maintainer will reach for here.
      - name: Read the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          case "$version" in
            "" | *[!0-9A-Za-z.-]* )
              # Newlines stripped before the value is echoed, and only here: a workflow command is
              # one line, so a `version` carrying `\n::add-mask::x` would otherwise have its second
              # line parsed as a command of its own -- forging annotations, or masking a character
              # across every later line of the run. `cd.yml` has no equivalent exposure, because a
              # tag name cannot contain a newline; free text from a dispatch can.
              echo "::error::Refusing '$(printf '%s' "$VERSION" | tr -d '\r\n')': a version must be non-empty [0-9A-Za-z.-]" >&2
              exit 1
              ;;
            *-SNAPSHOT )
              # Refused where `cd.yml` refuses it. Rehearsed anyway, a snapshot would skip every
              # `sign*` task and fail the signing check below with a message about signatures
              # rather than about the version.
              echo "::error::Refusing '$version': a -SNAPSHOT version is not a release, and cd.yml would refuse the tag" >&2
              exit 1
              ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: ./gradlew build checkKotlinAbi --stacktrace

      # `cd.yml`'s "Publish to the local repository" step, aimed at a directory the later steps can
      # inspect and nothing else can have written to. `~/.m2` would work on a fresh runner and hide
      # a failure on a warm one, and the whole point of the consumer step below is that it resolves
      # what *this* run published.
      #
      # GNUPGHOME sits under RUNNER_TEMP rather than a `mktemp -d`, because gpg-agent's socket path
      # has a ~104-character limit and a long temp path crosses it. That failure reads as "can't
      # connect to the gpg-agent", which does not sound like a path-length problem.
      - name: Publish every module to a local repository
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/dry-run-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          # Protected with a passphrase, and identified by a key id, because `cd.yml` passes both
          # -- and a rehearsal that signs through a simpler configuration than the release uses is
          # not rehearsing the release. With the passphrase wrong, `signJvmPublication` FAILS with
          # `PGPException: checksum mismatch in checksum of 20 bytes` (measured in
          # `uny/a2ui-compose`). That is the failure `cd.yml` would otherwise meet deep into a tag build,
          # since its pre-flight can only check that `GPG_PASSPHRASE` is non-empty, never that it
          # decrypts the key.
          #
          # The passphrase is a literal, deliberately. It protects a key that lives for one job and
          # whose public half is nowhere, so it is not a secret and must not be made into one --
          # exactly as the header argues for the key itself. What it buys is that
          # `signingInMemoryKeyPassword` is on the exercised path at all.
          passphrase='dry-run-not-a-secret'

          gpg --batch --pinentry-mode loopback --passphrase "$passphrase" \
            --quick-generate-key "AG-UI Dry Run <dryrun@example.invalid>" rsa3072 sign never

          # The short 8-hex id -- the only form Gradle accepts, and the form `cd.yml` requires of
          # `GPG_KEY_ID`. Parsed from `--with-colons` rather than the human-readable listing, whose
          # layout is not a stable interface: field 5 there is the 16-hex long id, whose low 8 hex
          # are the short one.
          key_id=$(
            gpg --batch --with-colons --list-secret-keys dryrun@example.invalid \
              | awk -F: '$1 == "sec" { print substr($5, 9); exit }'
          )
          case "$key_id" in
            [0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f] ) ;;
            * )
              # Empty or malformed would not fail the publish -- Gradle signs happily with the
              # property absent -- it would quietly drop this back to the weaker configuration the
              # passphrase above exists to avoid.
              echo "::error::could not derive the short 8-hex key id from the generated key (got '$key_id')" >&2
              exit 1
              ;;
          esac

          ORG_GRADLE_PROJECT_signingInMemoryKey=$(
            gpg --batch --pinentry-mode loopback --passphrase "$passphrase" \
              --armor --export-secret-keys dryrun@example.invalid
          )
          export ORG_GRADLE_PROJECT_signingInMemoryKey
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId="$key_id"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="$passphrase"
          # The runner masks `secrets.*`, and this key is not one, so nothing would redact it if a
          # later `--debug` echoed it. The key is throwaway and no dump path reaches it today, but
          # the shape of this step is what gets copied into one holding a real key. Per line,
          # because `::add-mask::` reads one line: masking the whole variable in one call would
          # register only the `-----BEGIN...` header and leave every byte that matters in the clear.
          while IFS= read -r key_line; do
            [ -n "$key_line" ] && echo "::add-mask::${key_line}"
          done <<< "$ORG_GRADLE_PROJECT_signingInMemoryKey"

          ./gradlew publishToMavenLocal -PVERSION_NAME="$VERSION" \
            -Dmaven.repo.local="${RUNNER_TEMP}/dry-run-m2" --stacktrace

      # The gate `cd.yml` runs before its upload, pointed at the same directory. `mavenLocal()` in
      # `smoke-test/settings.gradle.kts` honours `-Dmaven.repo.local`, and it is `exclusiveContent`
      # -bound to `dev.ynagai.agui`, so nothing else can answer for the group under test -- and
      # `includeGroup` is exact, so `dev.ynagai.a2ui`, which `agui-a2ui` depends on and which is
      # already on Central, is still resolved from Central here as it would be for a consumer.
      #
      # `:floor:assemble` is the `compileSdk` floor, and it is a second consumer rather than a
      # second source set: the root project compiles its Android target at 37, and one Android
      # library cannot be built at two API levels. `floor` is at 24 and depends on the four modules
      # that draw nothing, so AGP's `checkAarMetadata` -- which `assemble` runs -- fails naming any
      # of them that asks for more. That is `docs/decisions/0014`'s promise, checked the way a
      # consumer would find it broken.
      - name: Resolve it as a consumer would
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./gradlew -p smoke-test \
            compileCommonMainKotlinMetadata compileNoIosX64MainKotlinMetadata compileKotlinJvm \
            compileKotlinIosArm64 compileKotlinIosSimulatorArm64 compileKotlinIosX64 \
            compileAndroidMain :floor:assemble \
            -PaguiVersion="$VERSION" -Dmaven.repo.local="${RUNNER_TEMP}/dry-run-m2" --stacktrace

      # Central requires a detached signature for every deployed file, and a local repository takes
      # unsigned artifacts without complaint. The publish above would fail if a publication
      # *declared* an `.asc` it could not produce -- but if `signAllPublications()` were removed or
      # made conditional, nothing would be declared, the publish would succeed, and the consumer
      # step would pass. That break reaches a release; this is what stops it.
      #
      # The POM count comes first because everything after it looks for an *absence*, and a check
      # like that reports success just as cheerfully when it is looking at nothing. `-e` is on by
      # default here but `-o pipefail` is not, so inside `find … | wc -l` the status is `wc`'s and
      # find's exit on a missing directory is discarded. Both ways of looking at nothing -- an
      # absent tree and a present but empty one -- are caught by the count.
      #
      # Checked on this tree on 2026-09-15: a `0.1.0-probe` publish signed with a throwaway key
      # lands 48 POMs and every file has a sibling `.asc`. The removed-`.asc` direction was
      # checked in `uny/a2ui-compose`, from which this step is copied unchanged.
      - name: Check every published file is signed
        run: |
          repo="${RUNNER_TEMP}/dry-run-m2"
          published=$(find "$repo" -name '*.pom' | wc -l | tr -d ' ')
          if [ "$published" -eq 0 ]; then
            echo "::error::no POMs under $repo — the publish did not land there, so the check below would pass without inspecting anything" >&2
            exit 1
          fi
          echo "Inspecting $published published POMs."

          unsigned=$(find "$repo" -type f \
            ! -name '*.asc' ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' \
            ! -name 'maven-metadata*' \
            -exec sh -c '[ -f "$1.asc" ] || echo "$1"' _ {} \;)
          if [ -n "$unsigned" ]; then
            echo "::error::published files carry no detached signature; Maven Central requires one per deployed file" >&2
            echo "$unsigned"
            exit 1
          fi
          echo "Every published file carries a .asc."

      # The two POM fields a module has to *opt into*. The plugin fills `url`, `licenses`,
      # `developers` and `scm` from the root `gradle.properties`, but `name` and `description`
      # come from `POM_NAME` / `POM_DESCRIPTION` in the module's own `gradle.properties`, and a
      # module without that file publishes a POM with neither -- which Central's validation
      # refuses. Found by this check on 2026-09-15: four of the nine modules had no such file and
      # their 20 POMs carried no `<name>` and no `<description>`, after a green consumer step and a
      # green signing check. A grep over the tree the step above already enumerated is what turns
      # "Central will tell you" into a failure here.
      #
      # Anchored to the two-space indent of a child of `<project>`, because a bare `<name>` also
      # matches the licence's and the developer's, which every POM here carries -- and a check that
      # matched those would have passed the twenty POMs it exists to catch.
      - name: Check every POM carries a name and a description
        run: |
          repo="${RUNNER_TEMP}/dry-run-m2"
          incomplete=$(find "$repo" -name '*.pom' \
            -exec sh -c 'grep -q "^  <name>" "$1" && grep -q "^  <description>" "$1" || echo "$1"' _ {} \;)
          if [ -n "$incomplete" ]; then
            echo "::error::POMs without <name> or <description>; add POM_NAME and POM_DESCRIPTION to that module's gradle.properties" >&2
            echo "$incomplete"
            exit 1
          fi
          echo "Every POM carries a name and a description."

      - name: Summarise
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.value }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
        run: |
          {
            # `always()`, so this also runs when no version was ever recorded -- the step refused
            # its input, or never ran because checkout or setup failed. `VERSION` is the empty
            # string in both cases and a bare heading would read "for v", so report the step's
            # outcome rather than guessing which of the two it was.
            if [ -n "$VERSION" ]; then
              echo "### Release dry run for v${VERSION}"
            else
              echo "### Release dry run — no version was read (\`Read the version\`: ${VERSION_OUTCOME})"
            fi
            echo
            echo 'Nothing left this runner: no Maven Central upload, no tag, no release.'
            echo
            echo "- ref: \`${{ github.sha }}\`"
            echo '- any signing in this run used a throwaway key generated in the job, whose public'
            echo '  half is nowhere — a signature Central could not verify even if something'
            echo '  uploaded it.'
            echo
            echo 'Not covered: Central'"'"'s own validation. Beyond name and description, the'
            echo 'required POM fields, the staging bundle, and whether the release key is on a'
            echo 'keyserver are only exercised by a real upload.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-dry-run
          path: '**/build/reports/**'
          retention-days: 7
