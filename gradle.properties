# 6G, as in `a2ui-compose`, and for its reason. The drawing modules publish Kotlin/JS and
# Kotlin/Wasm, and their executables link the whole composition -- Compose UI, Material 3, Skiko --
# into one IR binary. At 4G `compileProductionExecutableKotlinWasmJs` in `agui-material3` and
# `agui-markdown` failed with `OutOfMemoryError: GC overhead limit exceeded`, which no source
# change explains. The Kotlin daemon inherits this line; setting `kotlin.daemon.jvmargs` instead
# replaces KGP's own daemon arguments rather than adding to them.
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is OFF on purpose. Kotlin Multiplatform does not fully support it yet --
# MetadataDependencyTransformationTask fails to serialize. Revisit once KGP supports it cleanly.
# org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

