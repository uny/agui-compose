# 4G rather than the default. `a2ui-compose` needs 6G, but only because its Kotlin/JS and
# Kotlin/Wasm executables link the whole Compose composition into one IR binary. This repository
# publishes no web target (see `docs/decisions/0001-riding-on-the-upstream-kotlin-sdk.md`), so the
# heaviest task here is an Apple klib link. Raise it if that stops being true.
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is OFF on purpose. Kotlin Multiplatform does not fully support it yet --
# MetadataDependencyTransformationTask fails to serialize. Revisit once KGP supports it cleanly.
# org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

