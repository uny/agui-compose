[versions]
kotlin = "2.4.10"
agp = "9.3.2"
coroutines = "1.11.0"
serialization = "1.11.0"
publish = "0.37.0"
dokka = "2.2.0"

# Compose Multiplatform. 1.12.0 is what fixes this repository's UI target set: its `foundation`,
# `ui` and `runtime` modules publish `ios_arm64` and `ios_simulator_arm64` and no `ios_x64`, so a
# module that draws cannot reach an Intel simulator however it is configured. See the target block
# in `agui-compose/build.gradle.kts`.
composeMultiplatform = "1.12.0"

# material3 ships on its own version line, independent of the Compose Multiplatform release, and
# resolves its own `foundation`/`ui` requirements to `composeMultiplatform` above rather than to the
# 1.9.1 it asks for. Consumed by `agui-material3`, and by nothing below it.
composeMaterial3 = "1.9.0"

# The Markdown parser and renderer behind `agui-markdown`. 0.45.0 is the newest release, and it
# publishes exactly this repository's UI target set -- `android`, `jvm`, `ios_arm64`,
# `ios_simulator_arm64` -- alongside targets this repository does not take. Its streaming parser
# (`StreamingMarkdownState`) landed in 0.42.0.
markdownRenderer = "0.45.0"

# The upstream AG-UI Kotlin SDK. The Maven group is `com.ag-ui.community`; `com.agui` is only the
# package prefix, which is easy to mistake for the coordinate.
#
# 0.4.1 is both the newest release and the newest commit on `sdks/community/kotlin/library`
# (`9770f32`, 2026-06-02), so pinning the release leaves nothing on the branch behind.
agui = "0.4.1"

# RFC 6902 patch application, for STATE_DELTA and ACTIVITY_DELTA. The same library and version the
# upstream client applies STATE_DELTA with, so a graph containing both resolves to one copy.
jsonPatch = "1.0.0"

# The published floor: this becomes `minCompileSdk` in the AAR metadata, so it is what every
# Android consumer must compile against. One value for the whole repository rather than a lower one
# for the non-UI modules -- the Compose modules this repository will ship force 37 through
# androidx.compose, and a consumer taking any of them needs 37 regardless.
android-compileSdk = "37"
android-minSdk = "24"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# `kotlin-core` carries the protocol types and nothing else. `kotlin-client` -- the transport, the
# SSE parser, the event verifier -- arrives with the agent layer; it is not needed to fold events
# into a render model, and it would put Ktor on the classpath of a module that opens no socket.
agui-core = { module = "com.ag-ui.community:kotlin-core", version.ref = "agui" }

json-patch = { module = "io.github.reidsync:kotlin-json-patch", version.ref = "jsonPatch" }

# Compose Multiplatform artifacts are declared explicitly rather than through the `compose.runtime`
# shorthand on the plugin extension, which is deprecated as of CMP 1.12.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }

# The plain artifact, not `-m3`. `-m3` is a thin layer whose whole content is `markdownColor()` and
# `markdownTypography()` reading `MaterialTheme`, and taking it would put a design system under
# every consumer of `agui-markdown` -- the same reason this parser is not folded into
# `agui-material3`. Note that it would not arrive transitively: this library declares every Compose
# dependency `compileOnly`, so neither artifact carries `material3` in its metadata and a module
# using `-m3` has to declare `material3` itself. See `docs/decisions/0004`.
markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "markdownRenderer" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
